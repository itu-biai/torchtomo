[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchtomo"
version = "0.3.0"
description = "Differentiable CT Reconstruction in Pure PyTorch"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [{ name = "BIAI Lab" }]
requires-python = ">=3.10"
keywords = ["ct", "tomography", "reconstruction", "pytorch", "differentiable", "deep-learning", "non-commercial", "cc-by-nc-4.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=1.10",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]

[project.urls]
Homepage = "https://github.com/itu-biai/torchtomo"
Repository = "https://github.com/itu-biai/torchtomo"
Issues = "https://github.com/itu-biai/torchtomo/issues"
License = "https://creativecommons.org/licenses/by-nc/4.0/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# CUDA source compiled at run time by NVRTC; nothing is built at install.
torchtomo = ["*.cu"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
