[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchtomo"
version = "0.1.0"
description = "Differentiable CT Reconstruction in Pure PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BIAI Lab" }]
requires-python = ">=3.9"
keywords = ["ct", "tomography", "reconstruction", "pytorch", "differentiable", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=1.10",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "astra-toolbox",
    "build",
    "matplotlib",
    "pytest",
    "pytest-cov",
    "ruff",
    "scikit-image",
    "twine",
]

[project.urls]
Homepage = "https://github.com/biailab/torchtomo"
Repository = "https://github.com/biailab/torchtomo"
Issues = "https://github.com/biailab/torchtomo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
